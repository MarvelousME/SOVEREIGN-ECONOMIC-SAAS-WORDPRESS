# security/fail2ban/action.d/cloudflare-block.conf
# Fail2ban action: push banned IPs to Cloudflare IP Access Rules.
# Requires: CF_API_TOKEN env var with Zone:Firewall Rules:Edit permission
#           CF_ZONE_ID env var

[Definition]

actionstart =

actionstop =

actioncheck =

# Ban: add IP to Cloudflare block list
actionban = curl -s -X POST \
    "https://api.cloudflare.com/client/v4/zones/<CF_ZONE_ID>/firewall/access_rules/rules" \
    -H "Authorization: Bearer <CF_API_TOKEN>" \
    -H "Content-Type: application/json" \
    --data '{
        "mode": "block",
        "configuration": {
            "target": "ip",
            "value": "<ip>"
        },
        "notes": "fail2ban auto-ban [<name>] at <time>"
    }'

# Unban: remove IP from Cloudflare block list
actionunban = RULE_ID=$(curl -s \
    "https://api.cloudflare.com/client/v4/zones/<CF_ZONE_ID>/firewall/access_rules/rules?mode=block&configuration_value=<ip>" \
    -H "Authorization: Bearer <CF_API_TOKEN>" \
    | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['result'][0]['id'] if data['result'] else '')" \
    ); \
    if [ -n "$RULE_ID" ]; then \
        curl -s -X DELETE \
            "https://api.cloudflare.com/client/v4/zones/<CF_ZONE_ID>/firewall/access_rules/rules/$RULE_ID" \
            -H "Authorization: Bearer <CF_API_TOKEN>"; \
    fi

[Init]
CF_API_TOKEN = %(CF_API_TOKEN)s
CF_ZONE_ID   = %(CF_ZONE_ID)s
