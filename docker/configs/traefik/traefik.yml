# =============================================================================
# Traefik API Gateway - Static Configuration
# UBI-CMS Platform
# =============================================================================

# API and Dashboard Configuration
api:
  dashboard: true
  insecure: false  # Dashboard accessed via auth

# Entry Points
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
        domains:
          - main: ubi-cms.local
            sans:
              - "*.ubi-cms.local"
    # HTTP/2 enabled by default
    http2:
      maxConcurrentStreams: 250

  metrics:
    address: ":8082"

  traefik:
    address: ":8080"

# Providers
providers:
  # Container discovery: Docker Engine or Podman (Podman uses the same Docker-compatible API).
  # Mount the host socket into Traefik as /var/run/docker.sock (see TRAEFIK_PLATFORM_SOCKET in compose).
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    allowEmptyServices: true
    network: ubi-cms-network
    watch: true
    defaultRule: "Host(`{{ normalize .Name }}.ubi-cms.local`)"

  # File provider for dynamic configuration
  file:
    directory: /etc/traefik/dynamic
    watch: true

# Certificate Resolvers
certificatesResolvers:
  # Let's Encrypt for production
  letsencrypt:
    acme:
      email: admin@ubi-cms.local
      storage: /etc/traefik/acme.json
      # Use staging CA during testing to avoid rate limits
      # caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      caServer: https://acme-v02.api.letsencrypt.org/directory
      httpChallenge:
        entryPoint: web
      # DNS challenge for wildcard certificates (optional)
      # dnsChallenge:
      #   provider: cloudflare
      #   delayBeforeCheck: 0

  # Self-signed certificates for development
  selfsigned:
    acme:
      email: admin@ubi-cms.local
      storage: /etc/traefik/acme-dev.json
      tlsChallenge: {}

# Logging (stdout — works without /var/log/traefik in the container)
log:
  level: INFO
  format: json

# Access logs (stdout JSON; scrape via container logs or forwarder)
accessLog:
  format: json
  bufferingSize: 100
  filters:
    statusCodes:
      - "200"
      - "300-302"
      - "400-599"
    retryAttempts: true
    minDuration: "10ms"
  fields:
    defaultMode: keep
    names:
      ClientUsername: drop
    headers:
      defaultMode: keep
      names:
        User-Agent: keep
        Authorization: drop
        Content-Type: keep

# Metrics - Prometheus
metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    buckets:
      - 0.1
      - 0.3
      - 1.2
      - 5.0

# Global Configuration
global:
  checkNewVersion: true
  sendAnonymousUsage: false

# OpenTelemetry traces (OTLP HTTP). Point at your collector; override with TRAEFIK_TRACING_OTLP_HTTP_ENDPOINT.
# Use docker/compose/docker-compose.observability.yml or attach gateway to the same network as otel-collector.
tracing:
  serviceName: traefik-ubi-cms
  sampleRate: 1.0
  otlp:
    http:
      endpoint: http://otel-collector:4318/v1/traces

# Pilot (optional - Traefik Pilot for monitoring)
# pilot:
#   token: "your-pilot-token"

# Experimental Features
experimental:
  plugins:
    # Add custom plugins if needed
    # Example: rate limiting plugin
    # ratelimit:
    #   moduleName: github.com/traefik/plugin-ratelimit
    #   version: v0.1.0

# ServersTransport (for backend communication)
serversTransport:
  insecureSkipVerify: false
  rootCAs:
    - /etc/traefik/certs/ca.crt
  maxIdleConnsPerHost: 200
  forwardingTimeouts:
    dialTimeout: 30s
    responseHeaderTimeout: 0s
    idleConnTimeout: 90s

# HTTP Options
# hostResolver:
#   cnameFlattening: true
#   resolvConfig: /etc/resolv.conf
#   resolvDepth: 5
