  #     - "traefik.http.routers.portal-ui.entrypoints=websecure"
  #     - "traefik.http.routers.portal-ui.tls.certresolver=letsencrypt"
  #     - "traefik.http.routers.portal-ui.middlewares=public-chain@file"
  #     - "traefik.http.services.portal-ui.loadbalancer.server.port=3000"
  
  # admin-ui:
  #   image: your-admin-ui:latest
  #   container_name: ubi-cms-admin-ui
  #   networks:
  #     - ubi-cms-network
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.admin-ui.rule=Host(`admin.ubi-cms.local`)"
  #     - "traefik.http.routers.admin-ui.entrypoints=websecure"
