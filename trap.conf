# security/nginx/trap.conf
# Nginx trap router — intercepts decoy URLs and routes to Glastopf honeypot.
# This is NOT your production nginx. It runs in the security-net only.
# Your production reverse proxy (Caddy/Nginx/Traefik) should forward
# traffic matching decoy paths to this container's port 8888.

worker_processes 1;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 256;
}

http {
    # Include blocked IPs (updated by fail2ban / Cloudflare sync)
    include /etc/nginx/blocked-ips.conf;

    log_format trap_log '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'trap="$request_uri"';

    access_log /var/log/nginx/trap-access.log trap_log;

    # ── Decoy paths that route to web honeypot ──────────────────────────────
    # These are the most commonly scanned paths on the internet.
    # Any hit on these paths = attacker or automated scanner.

    server {
        listen 80;
        server_name _;

        # Block known bad IPs immediately
        if ($blocked_ip) {
            return 444;  # Drop connection silently
        }

        # Decoy admin panels
        location ~ ^/(admin|wp-admin|administrator|phpmyadmin|cpanel|plesk|webmail) {
            proxy_pass http://glastopf:80;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Trap-Path $request_uri;
            proxy_set_header Host $host;
        }

        # Decoy config/env files
        location ~ ^/(\.env|config\.php|wp-config\.php|\.git|\.svn|backup|\.htaccess) {
            proxy_pass http://glastopf:80;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Trap-Path $request_uri;
        }

        # Decoy API endpoints (common scanner targets)
        location ~ ^/(api/v1/users|api/login|rest/V1|xmlrpc\.php|cgi-bin) {
            proxy_pass http://glastopf:80;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Trap-Path $request_uri;
        }

        # Decoy database tools
        location ~ ^/(pma|phpmyadmin|myadmin|mysql|adminer|db) {
            proxy_pass http://glastopf:80;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Trap-Path $request_uri;
        }

        # Catch-all: anything not matching goes to glastopf (this is a trap server)
        location / {
            proxy_pass http://glastopf:80;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Trap-Path $request_uri;
        }
    }
}
