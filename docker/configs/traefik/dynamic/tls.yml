# =============================================================================
# Traefik Dynamic Configuration - TLS/SSL Configuration
# Certificates, Options, and Stores
# =============================================================================

tls:
  # ===========================================================================
  # TLS Options
  # ===========================================================================
  
  options:
    # Default TLS configuration
    default:
      minVersion: VersionTLS12
      maxVersion: VersionTLS13
      cipherSuites:
        # TLS 1.3 cipher suites (preferred)
        - TLS_AES_256_GCM_SHA384
        - TLS_AES_128_GCM_SHA256
        - TLS_CHACHA20_POLY1305_SHA256
        # TLS 1.2 cipher suites (backward compatibility)
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
      curvePreferences:
        - CurveP521
        - CurveP384
      sniStrict: true
      alpnProtocols:
        - h2
        - http/1.1

    # Modern TLS configuration (TLS 1.3 only)
    modern:
      minVersion: VersionTLS13
      maxVersion: VersionTLS13
      cipherSuites:
        - TLS_AES_256_GCM_SHA384
        - TLS_CHACHA20_POLY1305_SHA256
      curvePreferences:
        - CurveP521
        - CurveP384
      sniStrict: true
      alpnProtocols:
        - h2
        - http/1.1

    # Intermediate TLS configuration (balance security and compatibility)
    intermediate:
      minVersion: VersionTLS12
      maxVersion: VersionTLS13
      cipherSuites:
        - TLS_AES_256_GCM_SHA384
        - TLS_AES_128_GCM_SHA256
        - TLS_CHACHA20_POLY1305_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
      curvePreferences:
        - CurveP384
        - CurveP256
      sniStrict: false

  # ===========================================================================
  # TLS Certificates
  # ===========================================================================
  
  certificates:
    # Development self-signed certificate
    - certFile: /etc/traefik/certs/ubi-cms.local.crt
      keyFile: /etc/traefik/certs/ubi-cms.local.key
      stores:
        - default

    # Wildcard certificate for subdomains
    - certFile: /etc/traefik/certs/wildcard.ubi-cms.local.crt
      keyFile: /etc/traefik/certs/wildcard.ubi-cms.local.key
      stores:
        - default

  # ===========================================================================
  # TLS Stores
  # ===========================================================================
  
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/certs/ubi-cms.local.crt
        keyFile: /etc/traefik/certs/ubi-cms.local.key
      defaultGeneratedCert:
        resolver: letsencrypt
        domain:
          main: ubi-cms.local
          sans:
            - "*.ubi-cms.local"

# ===========================================================================
# HTTP to HTTPS Redirect (handled in static config but can be reinforced)
# ===========================================================================

http:
  middlewares:
    # Force HTTPS redirect middleware
    force-https:
      redirectScheme:
        scheme: https
        permanent: true
        port: "443"

  # Apply to all HTTP routes
  routers:
    http-catchall:
      rule: "HostRegexp(`{host:.+}`)"
      entryPoints:
        - web
      middlewares:
        - force-https
      service: noop@internal
      priority: 1
