# security/logstash/pipeline/01-suricata.conf
input {
  file {
    path  => "/var/log/suricata/eve.json"
    codec => "json"
    tags  => ["suricata", "ids"]
    type  => "suricata"
    sincedb_path => "/dev/null"
    start_position => "beginning"
  }
}

filter {
  if [type] == "suricata" {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
    mutate {
      add_field => { "source_system" => "suricata-ids" }
    }
    if [event_type] == "alert" {
      mutate {
        add_tag => ["alert", "ids-alert"]
        add_field => { "severity" => "%{[alert][severity]}" }
        add_field => { "signature" => "%{[alert][signature]}" }
      }
    }
  }
}

output {
  if "ids-alert" in [tags] {
    elasticsearch {
      hosts    => ["elasticsearch:9200"]
      user     => "elastic"
      password => "${ELASTIC_PASSWORD}"
      index    => "suricata-alerts-%{+YYYY.MM.dd}"
    }
  }
  elasticsearch {
    hosts    => ["elasticsearch:9200"]
    user     => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index    => "suricata-%{+YYYY.MM.dd}"
  }
}
