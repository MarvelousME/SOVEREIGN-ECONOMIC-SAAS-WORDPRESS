# NATS Server Configuration for UBI-CMS
# Optimized for event-driven architecture with JetStream

# Server settings
server_name: ubi-cms-nats
listen: 0.0.0.0:4222
http_port: 8222

# Logging
debug: false
trace: false
logtime: true
log_file: "/tmp/nats-server.log"

# Limits
max_connections: 1000
max_payload: 1048576  # 1MB
max_pending: 67108864  # 64MB

# Authorization (for production, use proper auth)
# For development, we allow anonymous access
# In production, configure accounts and users
authorization {
  timeout: 2
}

# JetStream Configuration
jetstream {
  # Storage directory for JetStream
  store_dir: "/data/jetstream"
  
  # Maximum memory and storage
  max_memory_store: 1GB
  max_file_store: 10GB
  
  # Domain (optional, useful for multi-cluster setups)
  # domain: "ubi-cms"
}

# Monitoring
# Access monitoring endpoint at http://localhost:8222/varz
http: 8222

# Cluster configuration (for future horizontal scaling)
# cluster {
#   name: ubi-cms-cluster
#   listen: 0.0.0.0:6222
#   routes: [
#     nats://nats-1:6222
#     nats://nats-2:6222
#   ]
# }

# Leafnode configuration (for edge deployments)
# leafnodes {
#   listen: 0.0.0.0:7422
# }

# WebSocket support (for browser clients)
websocket {
  listen: 0.0.0.0:8080
  no_tls: true
}

# Message tracing (for debugging)
# trace_verbose: false

# System account for monitoring
# system_account: SYS
