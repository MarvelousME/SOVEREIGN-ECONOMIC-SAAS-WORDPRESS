# docker-compose.local.yml
# Minimal local development stack - just what you need to run the API
# Usage: docker compose -f docker-compose.local.yml up -d

version: '3.8'

services:
  # ==========================================
  # PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: ubi-postgres-local
    environment:
      POSTGRES_DB: ${DB_NAME:-ubi_dev}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/dev-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./api/dev-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - ./api/dev-patch.sql:/docker-entrypoint-initdb.d/03-dev-patch.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ubi_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================
  # Redis (for sessions and caching)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: ubi-redis-local
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ==========================================
  # API Service
  # ==========================================
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: ubi-api-local
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ubi_dev}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-devpassword123}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-devpassword123}@postgres:5432/${DB_NAME:-ubi_dev}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production-must-be-at-least-32-chars}
      JWT_EXPIRY: 24h
      CORS_ORIGIN: http://localhost:3001,http://localhost:3000
      LOG_LEVEL: debug
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api/src:/app/src
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: ubi-local-network
