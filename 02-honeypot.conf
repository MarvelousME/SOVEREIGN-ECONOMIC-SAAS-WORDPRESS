# security/logstash/pipeline/02-honeypot.conf
input {
  file {
    path  => "/var/log/cowrie/cowrie.json"
    codec => "json"
    tags  => ["cowrie", "honeypot", "ssh"]
    type  => "cowrie"
  }
  file {
    path  => "/var/log/nginx/trap-access.log"
    tags  => ["glastopf", "honeypot", "web"]
    type  => "glastopf"
  }
}

filter {
  if [type] == "cowrie" {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
    mutate {
      add_field => { "source_system" => "cowrie-honeypot" }
      add_field => { "attacker_ip"   => "%{src_ip}" }
    }
    # Tag credential stuffing attempts
    if [eventid] == "cowrie.login.failed" {
      mutate { add_tag => ["credential-stuffing"] }
    }
    if [eventid] == "cowrie.login.success" {
      mutate { add_tag => ["honeypot-login-success", "critical"] }
    }
  }

  if [type] == "glastopf" {
    grok {
      match => {
        "message" => '%{IPORHOST:attacker_ip} - %{DATA} \[%{HTTPDATE:timestamp}\] "%{WORD:method} %{DATA:trap_path} HTTP/%{NUMBER}" %{NUMBER:status}'
      }
    }
    date {
      match => ["timestamp", "dd/MMM/yyyy:HH:mm:ss Z"]
      target => "@timestamp"
    }
    mutate {
      add_field => { "source_system" => "glastopf-honeypot" }
      add_tag   => ["web-scan"]
    }
    # Detect common exploit patterns in path
    if [trap_path] =~ /(union|select|insert|drop|exec|eval|base64_decode)/ {
      mutate { add_tag => ["sqli-attempt"] }
    }
    if [trap_path] =~ /(\.\.\/|%2e%2e%2f|%252e)/ {
      mutate { add_tag => ["path-traversal"] }
    }
  }
}

output {
  elasticsearch {
    hosts    => ["elasticsearch:9200"]
    user     => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index    => "honeypot-%{+YYYY.MM.dd}"
  }
}
