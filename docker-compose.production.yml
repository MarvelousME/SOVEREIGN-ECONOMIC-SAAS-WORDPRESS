# docker-compose.production.yml
# Production stack: API + Frontend + PostgreSQL + Redis + Nginx
# Usage:
#   cp .env.production.example .env.production
#   # fill in .env.production with real secrets
#   docker compose -f docker-compose.production.yml --env-file .env.production up -d

version: '3.8'

services:

  # ──────────────────────────────────────────────────────────────────────────
  # PostgreSQL — primary database
  # ──────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ubi-postgres-prod
    restart: always
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/dev-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend
    # Do NOT expose port 5432 to host in production
    deploy:
      resources:
        limits:
          memory: 512M

  # ──────────────────────────────────────────────────────────────────────────
  # Redis — caching and session store
  # ──────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ubi-redis-prod
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --save 300 1
      --loglevel warning
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M

  # ──────────────────────────────────────────────────────────────────────────
  # API — Node.js backend
  # ──────────────────────────────────────────────────────────────────────────
  api:
    image: ${API_IMAGE:-ubi-api:latest}
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: ubi-api-prod
    restart: always
    environment:
      NODE_ENV:      production
      PORT:          3000
      DB_HOST:       postgres
      DB_PORT:       5432
      DB_NAME:       ${DB_NAME}
      DB_USER:       ${DB_USER}
      DB_PASSWORD:   ${DB_PASSWORD}
      DATABASE_URL:  postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_HOST:    redis
      REDIS_PORT:    6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET:    ${JWT_SECRET}
      JWT_EXPIRY:    ${JWT_EXPIRY:-1h}
      CORS_ORIGIN:   ${CORS_ORIGIN}
      LOG_LEVEL:     ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend
      - frontend
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ──────────────────────────────────────────────────────────────────────────
  # Portal UI — Next.js frontend
  # ──────────────────────────────────────────────────────────────────────────
  portal-ui:
    image: ${PORTAL_IMAGE:-ubi-portal-ui:latest}
    build:
      context: ./frontend/portal-ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL:  ${NEXT_PUBLIC_WS_URL}
    container_name: ubi-portal-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT:     3001
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - frontend
    deploy:
      resources:
        limits:
          memory: 512M

  # ──────────────────────────────────────────────────────────────────────────
  # Nginx — TLS termination, reverse proxy, static assets
  # ──────────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: ubi-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
      - portal-ui
    networks:
      - frontend
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data:
  redis_data:
  nginx_logs:

networks:
  backend:
    internal: true
  frontend:
