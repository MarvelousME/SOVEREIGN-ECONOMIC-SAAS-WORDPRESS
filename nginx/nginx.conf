user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─── Logging ──────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # ─── Performance ──────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_types         text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length    1000;
    gzip_comp_level    6;

    # ─── Security headers (global) ────────────────────────────────────────
    add_header X-Frame-Options          DENY            always;
    add_header X-Content-Type-Options   nosniff         always;
    add_header X-XSS-Protection         "1; mode=block" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    server_tokens off;

    # ─── Rate limiting ────────────────────────────────────────────────────
    limit_req_zone  $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone  $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # ─── Upstream services ────────────────────────────────────────────────
    upstream api_backend {
        least_conn;
        server api:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream portal_frontend {
        server portal-ui:3001;
        keepalive 16;
    }

    # ─── HTTP → HTTPS redirect ────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ─── API server ───────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name api.ubi-platform.com;

        ssl_certificate     /etc/nginx/certs/api.crt;
        ssl_certificate_key /etc/nginx/certs/api.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        client_max_body_size 10M;

        # Auth endpoints — stricter rate limit
        location /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            limit_conn conn 10;
            proxy_pass http://api_backend;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # All other API endpoints
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            limit_conn conn 20;
            proxy_pass http://api_backend;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # Internal health check — no rate limit, no auth
        location /health {
            proxy_pass http://api_backend;
            include /etc/nginx/conf.d/proxy_params.conf;
            access_log off;
        }

        location /ready {
            proxy_pass http://api_backend;
            include /etc/nginx/conf.d/proxy_params.conf;
            access_log off;
        }
    }

    # ─── Portal UI ────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name portal.ubi-platform.com;

        ssl_certificate     /etc/nginx/certs/portal.crt;
        ssl_certificate_key /etc/nginx/certs/portal.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.ubi-platform.com wss://api.ubi-platform.com;" always;

        # Static Next.js assets with long-term caching
        location /_next/static/ {
            proxy_pass http://portal_frontend;
            include /etc/nginx/conf.d/proxy_params.conf;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            proxy_pass http://portal_frontend;
            include /etc/nginx/conf.d/proxy_params.conf;
        }
    }

    include /etc/nginx/conf.d/*.conf;
}
