version: '3.8'

services:
  # API Gateway
  gateway:
    image: traefik:v3.0
    container_name: ubi-cms-gateway
    ports:
      - "2025:80"
      - "2026:443"
    volumes:
      - ./configs/traefik:/etc/traefik
    networks:
      - ubi-network
    depends_on:
      - keycloak

  # Keycloak for IAM
  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    container_name: ubi-cms-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${DB_USER:-postgres}
      KC_DB_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "8080:8080"
    networks:
      - ubi-network
    depends_on:
      - postgres

  # PostgreSQL Database
  postgres:
    image: postgres:18.3
    container_name: ubi-cms-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ubi_cms
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ubi-network

  # Redis for caching and session
  redis:
    image: redis:8.6
    container_name: ubi-cms-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis}
    ports:
      - "6379:6379"
    networks:
      - ubi-network

  # MinIO for object storage
  minio:
    image: minio/minio:latest
    container_name: ubi-cms-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minio}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - ubi-network

  # NATS for event bus
  nats:
    image: nats:latest
    container_name: ubi-cms-nats
    command: ["-c", "/etc/nats/nats-server.conf", "-js"]
    ports:
      - "4222:4222"  # Client connections
      - "8222:8222"  # HTTP monitoring
      - "8080:8080"  # WebSocket
    volumes:
      - ./configs/nats/nats-server.conf:/etc/nats/nats-server.conf
      - nats-data:/data
    networks:
      - ubi-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Temporal for workflows
  temporal:
    image: temporalio/auto-setup:latest
    container_name: ubi-cms-temporal
    environment:
      - DB=postgres
      - DB_PORT=5432
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PWD=${DB_PASSWORD:-postgres}
      - POSTGRES_SEEDS=postgres
    ports:
      - "7233:7233"
    networks:
      - ubi-network
    depends_on:
      - postgres

networks:
  ubi-network:
    name: ubi-cms-network
    driver: bridge

volumes:
  postgres-data:
  minio-data:
  nats-data:
  prometheus-data:
  loki-data:
  grafana-data:
  opa-data:
  qdrant-data:
