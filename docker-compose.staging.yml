version: '3.8'

services:
  # API Gateway
  gateway:
    image: traefik:v3.0
    container_name: ubi-cms-gateway-staging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/configs/traefik:/etc/traefik
      - ./docker/certs:/certs
    networks:
      - ubi-network
    environment:
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    command:
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/certs/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    restart: unless-stopped
    depends_on:
      - keycloak

  # Keycloak for IAM
  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    container_name: ubi-cms-keycloak-staging
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-auth.staging.ubi-cms.example.com}
      KC_PROXY: edge
    networks:
      - ubi-network
    depends_on:
      postgres:
        condition: service_healthy
    command: start
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5

  # PostgreSQL Database
  postgres:
    image: postgres:18.3
    container_name: ubi-cms-postgres-staging
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ubi_cms
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ubi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # Redis for caching and session
  redis:
    image: redis:8.6
    container_name: ubi-cms-redis-staging
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 2gb --maxmemory-policy allkeys-lru
    networks:
      - ubi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  # MinIO for object storage
  minio:
    image: minio/minio:latest
    container_name: ubi-cms-minio-staging
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - ubi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  # NATS for event bus
  nats:
    image: nats:latest
    container_name: ubi-cms-nats-staging
    networks:
      - ubi-network
    command: ["-js", "-m", "8222"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Temporal for workflows
  temporal:
    image: temporalio/auto-setup:latest
    container_name: ubi-cms-temporal-staging
    environment:
      - DB=postgres
      - DB_PORT=5432
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PWD=${DB_PASSWORD}
      - POSTGRES_SEEDS=postgres
    networks:
      - ubi-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: ubi-cms-prometheus-staging
    volumes:
      - ./docker/configs/prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - ubi-network
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: ubi-cms-grafana-staging
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/configs/grafana:/etc/grafana/provisioning
    networks:
      - ubi-network
    depends_on:
      - prometheus
    restart: unless-stopped

  # Loki for logs
  loki:
    image: grafana/loki:latest
    container_name: ubi-cms-loki-staging
    volumes:
      - loki-data:/loki
      - ./docker/configs/loki:/etc/loki
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - ubi-network
    restart: unless-stopped

networks:
  ubi-network:
    name: ubi-cms-network-staging
    driver: bridge

volumes:
  postgres-data:
  minio-data:
  prometheus-data:
  grafana-data:
  loki-data:
