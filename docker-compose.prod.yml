version: '3.8'

services:
  # API Gateway
  gateway:
    image: traefik:v3.0
    container_name: ubi-cms-gateway-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/configs/traefik:/etc/traefik:ro
      - ./docker/certs:/certs
    networks:
      - ubi-network
    secrets:
      - letsencrypt_email
    environment:
      - LETSENCRYPT_EMAIL_FILE=/run/secrets/letsencrypt_email
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.storage=/certs/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--accesslog=true"
      - "--metrics.prometheus=true"
    restart: always
    depends_on:
      - keycloak
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # Keycloak for IAM
  keycloak:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-ubi-cms}/keycloak:${IMAGE_TAG:-latest}
    container_name: ubi-cms-keycloak-prod
    secrets:
      - keycloak_admin_password
      - db_password
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD_FILE: /run/secrets/keycloak_admin_password
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME_FILE: /run/secrets/db_user
      KC_DB_PASSWORD_FILE: /run/secrets/db_password
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
      KC_PROXY: edge
      KC_HTTP_ENABLED: "true"
    networks:
      - ubi-network
    depends_on:
      postgres:
        condition: service_healthy
    command: start --optimized
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # PostgreSQL Database
  postgres:
    image: postgres:18.3
    container_name: ubi-cms-postgres-prod
    secrets:
      - db_user
      - db_password
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ubi_cms
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.utf8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ubi-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    command: 
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "effective_cache_size=6GB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=10485kB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"

  # Redis for caching and session
  redis:
    image: redis:8.6-alpine
    container_name: ubi-cms-redis-prod
    secrets:
      - redis_password
    command: sh -c "redis-server --requirepass $$(cat /run/secrets/redis_password) --maxmemory 4gb --maxmemory-policy allkeys-lru --appendonly yes --appendfsync everysec"
    volumes:
      - redis-data:/data
    networks:
      - ubi-network
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # MinIO for object storage
  minio:
    image: minio/minio:latest
    container_name: ubi-cms-minio-prod
    secrets:
      - minio_root_user
      - minio_root_password
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - ubi-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # NATS for event bus
  nats:
    image: nats:alpine
    container_name: ubi-cms-nats-prod
    networks:
      - ubi-network
    command: ["-js", "-m", "8222", "--store_dir", "/data"]
    volumes:
      - nats-data:/data
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # Temporal for workflows
  temporal:
    image: temporalio/server:latest
    container_name: ubi-cms-temporal-prod
    secrets:
      - db_user
      - db_password
    environment:
      - DB=postgres
      - DB_PORT=5432
      - POSTGRES_USER_FILE=/run/secrets/db_user
      - POSTGRES_PWD_FILE=/run/secrets/db_password
      - POSTGRES_SEEDS=postgres
    networks:
      - ubi-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "tctl", "cluster", "health"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: ubi-cms-prometheus-prod
    volumes:
      - ./docker/configs/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - ubi-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: ubi-cms-grafana-prod
    secrets:
      - grafana_password
    environment:
      GF_SECURITY_ADMIN_PASSWORD_FILE: /run/secrets/grafana_password
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_SERVER_ROOT_URL: https://monitoring.${DOMAIN}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/configs/grafana:/etc/grafana/provisioning:ro
    networks:
      - ubi-network
    depends_on:
      - prometheus
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Loki for logs
  loki:
    image: grafana/loki:latest
    container_name: ubi-cms-loki-prod
    volumes:
      - loki-data:/loki
      - ./docker/configs/loki:/etc/loki:ro
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - ubi-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

networks:
  ubi-network:
    name: ubi-cms-network-prod
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: ubi-cms-br0

volumes:
  postgres-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/data/postgres
  minio-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/data/minio
  redis-data:
  nats-data:
  prometheus-data:
  grafana-data:
  loki-data:

secrets:
  db_user:
    external: true
  db_password:
    external: true
  redis_password:
    external: true
  minio_root_user:
    external: true
  minio_root_password:
    external: true
  keycloak_admin_password:
    external: true
  grafana_password:
    external: true
  letsencrypt_email:
    external: true
