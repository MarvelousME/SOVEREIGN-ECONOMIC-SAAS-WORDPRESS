version: '3.8'

services:
  # API Gateway
  gateway:
    image: traefik:v3.0
    container_name: ubi-cms-gateway-dev
    ports:
      - "2025:80"
      - "2026:443"
      - "8081:8080"  # Traefik dashboard
      - "8082:8082"  # Prometheus metrics (entrypoint metrics)
    # Podman exposes a Docker-compatible API; Traefik uses providers.docker against that socket.
    # Docker Desktop / engine: default TRAEFIK_PLATFORM_SOCKET=/var/run/docker.sock (host).
    # Rootful Podman (Linux): TRAEFIK_PLATFORM_SOCKET=/run/podman/podman.sock
    # Rootless Podman: TRAEFIK_PLATFORM_SOCKET=$XDG_RUNTIME_DIR/podman/podman.sock
    volumes:
      - ${TRAEFIK_PLATFORM_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
      - ubi-network
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.allowEmptyServices=true"
      - "--log.level=DEBUG"
      - "--log.format=json"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.metrics.address=:8082"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entrypoint=metrics"
      - "--tracing.otlp=true"
      - "--tracing.otlp.http=true"
      # Same network as docker/compose/docker-compose.observability.yml (ubi-network) for hostname otel-collector
      - "--tracing.otlp.http.endpoint=${TRAEFIK_TRACING_OTLP_HTTP_ENDPOINT:-http://otel-collector:4318/v1/traces}"
    depends_on:
      - keycloak

  # Keycloak for IAM
  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    container_name: ubi-cms-keycloak-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/ubi_cms
      KC_DB_USERNAME: ${DB_USER:-postgres}
      KC_DB_PASSWORD: ${DB_PASSWORD:-postgres}
      KC_LOG_LEVEL: DEBUG
    ports:
      - "8080:8080"
    networks:
      - ubi-network
    depends_on:
      postgres:
        condition: service_healthy
    command: start-dev

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ubi-cms-postgres-dev
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ubi_cms
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./api/dev-schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./api/dev-seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
    ports:
      - "5432:5432"
    networks:
      - ubi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis for caching and session
  redis:
    image: redis:8.6
    container_name: ubi-cms-redis-dev
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis} --loglevel debug
    ports:
      - "6379:6379"
    networks:
      - ubi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO for object storage
  minio:
    image: minio/minio:latest
    container_name: ubi-cms-minio-dev
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minio123456}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - ubi-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # NATS for event bus
  nats:
    image: nats:latest
    container_name: ubi-cms-nats-dev
    ports:
      - "4222:4222"
      - "8222:8222"  # HTTP monitoring
    networks:
      - ubi-network
    command: ["-js", "-m", "8222"]

  # Temporal for workflows
  temporal:
    image: temporalio/auto-setup:latest
    container_name: ubi-cms-temporal-dev
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PWD=${DB_PASSWORD:-postgres}
      - POSTGRES_SEEDS=postgres
    ports:
      - "7233:7233"
      - "8233:8233"  # Web UI
    networks:
      - ubi-network
    depends_on:
      postgres:
        condition: service_healthy

  # API Service
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: ubi-cms-api-dev
    environment:
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production-must-be-at-least-32-chars}
      DB_HOST: postgres
      DB_PORT: 5432
      # App data + seeds (migrations 001–011); Keycloak uses ubi_cms on same server
      DB_NAME: ubi_app
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/ubi_app
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis}@redis:6379
      NATS_URL: nats://nats:4222
      PORT: 3000
    ports:
      - "3000:3000"
      - "9229:9229"  # Debug port
    volumes:
      - ./api/src:/app/src
      - ./api/package.json:/app/package.json
    networks:
      - ubi-network
    depends_on:
      - postgres
      - redis
      - nats
    command: npm run dev

networks:
  ubi-network:
    name: ubi-cms-network-dev
    driver: bridge

volumes:
  postgres-data:
  minio-data:
