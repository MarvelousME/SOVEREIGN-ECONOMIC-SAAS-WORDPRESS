global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'ubi-cms-services'
    static_configs:
      - targets: ['gateway:2025', 'keycloak:8080', 'nats:4222', 'temporal:7233']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888', 'otel-collector:8889']