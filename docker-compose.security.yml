# =============================================================================
# Sovereign Economic Ecosystem — Security Stack
# Honeypots + IDS/IPS + Logging + Alerting + Cloudflare integration
# =============================================================================
# NETWORK LAYOUT:
#   sovereign-net     → production services (existing)
#   security-net      → honeypots + SIEM (isolated, no prod access)
#   monitoring-net    → Grafana/Kibana dashboards
#
# NEVER attach honeypot containers to sovereign-net.
# =============================================================================

version: "3.9"

services:
  honeypot-web:
    image: nginx:alpine
    container_name: sovereign-honeypot-web
    restart: unless-stopped
    ports:
      - "8088:80"
    networks:
      - security-net
    volumes:
      - ./trap.conf:/etc/nginx/nginx.conf:ro
    labels:
      - "security.role=honeypot"
      - "security.type=web"

  honeypot-ssh:
    image: alpine:3.20
    container_name: sovereign-honeypot-ssh
    restart: unless-stopped
    ports:
      - "2222:2222"
      - "2323:2323"
    networks:
      - security-net
    command: >
      sh -c "apk add --no-cache netcat-openbsd &&
      while true; do
        printf 'SSH-2.0-OpenSSH_8.2p1 Ubuntu-4ubuntu0.5\r\n' | nc -l -p 2222 -q 1;
      done"
    labels:
      - "security.role=honeypot"
      - "security.type=ssh"

  trap-router:
    image: nginx:alpine
    container_name: sovereign-trap-router
    restart: unless-stopped
    ports:
      - "8888:80"
    networks:
      - security-net
      - sovereign-net
    volumes:
      - ./trap.conf:/etc/nginx/nginx.conf:ro
      - ./cloudflare-block.conf:/etc/nginx/blocked-ips.conf:ro
    depends_on:
      - honeypot-web
    labels:
      - "security.role=trap-router"

  suricata:
    image: jasonish/suricata:latest
    container_name: sovereign-ids
    restart: unless-stopped
    command: suricata -i eth0 -v
    networks:
      - security-net
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./01-suricata.conf:/etc/suricata/suricata.yaml:ro
      - suricata-logs:/var/log/suricata
    labels:
      - "security.role=ids"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: sovereign-cloudflared
    restart: unless-stopped
    networks:
      - security-net
      - sovereign-net
    command: tunnel --no-autoupdate --url http://trap-router:80
    depends_on:
      - trap-router
    labels:
      - "security.role=tunnel"

networks:
  sovereign-net:
    external: true
  security-net:
    driver: bridge

volumes:
  suricata-logs:
