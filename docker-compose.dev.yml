version: '3.8'

services:
  # API Gateway
  gateway:
    image: traefik:v3.0
    container_name: ubi-cms-gateway-dev
    ports:
      - "2025:80"
      - "2026:443"
      - "8081:8080"  # Traefik dashboard
    volumes:
      - ./docker/configs/traefik:/etc/traefik
    networks:
      - ubi-network
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--log.level=DEBUG"
    depends_on:
      - keycloak

  # Keycloak for IAM
  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    container_name: ubi-cms-keycloak-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${DB_USER:-postgres}
      KC_DB_PASSWORD: ${DB_PASSWORD:-postgres}
      KC_LOG_LEVEL: DEBUG
    ports:
      - "8080:8080"
    networks:
      - ubi-network
    depends_on:
      postgres:
        condition: service_healthy
    command: start-dev

  # PostgreSQL Database
  postgres:
    image: postgres:18.3
    container_name: ubi-cms-postgres-dev
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ubi_cms
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./seeds:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - ubi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis for caching and session
  redis:
    image: redis:8.6
    container_name: ubi-cms-redis-dev
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis} --loglevel debug
    ports:
      - "6379:6379"
    networks:
      - ubi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO for object storage
  minio:
    image: minio/minio:latest
    container_name: ubi-cms-minio-dev
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minio123456}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - ubi-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # NATS for event bus
  nats:
    image: nats:latest
    container_name: ubi-cms-nats-dev
    ports:
      - "4222:4222"
      - "8222:8222"  # HTTP monitoring
    networks:
      - ubi-network
    command: ["-js", "-m", "8222"]

  # Temporal for workflows
  temporal:
    image: temporalio/auto-setup:latest
    container_name: ubi-cms-temporal-dev
    environment:
      - DB=postgres
      - DB_PORT=5432
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PWD=${DB_PASSWORD:-postgres}
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development.yaml
    ports:
      - "7233:7233"
      - "8233:8233"  # Web UI
    networks:
      - ubi-network
    depends_on:
      postgres:
        condition: service_healthy

  # API Service
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: development
    container_name: ubi-cms-api-dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/ubi_cms
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis}@redis:6379
      NATS_URL: nats://nats:4222
      PORT: 3000
    ports:
      - "3000:3000"
      - "9229:9229"  # Debug port
    volumes:
      - ./api/src:/app/src
      - ./api/package.json:/app/package.json
    networks:
      - ubi-network
    depends_on:
      - postgres
      - redis
      - nats
    command: npm run dev

networks:
  ubi-network:
    name: ubi-cms-network-dev
    driver: bridge

volumes:
  postgres-data:
  minio-data:
