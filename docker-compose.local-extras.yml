# Optional local dependencies (not required for docker-compose.local.yml)
# OpenSearch (logs/search experiments) + MailHog (SMTP capture)
#
# Usage:
#   docker compose -f docker-compose.local-extras.yml up -d
# Or: ./scripts/bootstrap-local-extras.sh  (Unix) / scripts/bootstrap-local-extras.ps1 (Windows)

version: '3.8'

services:
  mailhog:
    image: mailhog/mailhog:latest
    container_name: ubi-mailhog-local
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2
    container_name: ubi-opensearch-local
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    restart: unless-stopped

networks:
  default:
    name: ubi-local-extras-network
