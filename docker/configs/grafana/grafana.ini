[server]
http_port = 3000
domain = localhost

[database]
type = sqlite3

[security]
admin_user = admin
admin_password = admin
disable_gravatar = true

[users]
allow_sign_up = false

[auth.anonymous]
enabled = false

[log]
mode = console

[paths]
provisioning = /etc/grafana/provisioning

[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/default.json